<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Depths of Klargon</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #000;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			font-family: sans-serif;
		}

		#game-container {
			position: relative;
		}

		#game {
			display: block;
			image-rendering: pixelated;
		}

		#loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			font-size: 24px;
			text-align: center;
		}

		#loading-bar {
			width: 300px;
			height: 20px;
			background: #333;
			margin-top: 20px;
			border-radius: 10px;
			overflow: hidden;
		}

		#loading-progress {
			height: 100%;
			background: #8b5a2b;
			width: 0%;
			transition: width 0.2s;
		}
	</style>
</head>
<body>
	<div id="game-container">
		<canvas id="game" width="1024" height="640"></canvas>
		<div id="loading">
			<div>Loading...</div>
			<div id="loading-bar">
				<div id="loading-progress"></div>
			</div>
		</div>
	</div>
	<script src="game.js"></script>
</body>
</html>
