<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Coming Soon</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/png" href="/static/chicago/error/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/static/chicago/error/favicon.svg" />
		<link rel="shortcut icon" href="/static/chicago/error/favicon.ico" />
		<style>
			@font-face {
				font-family: 'dos_vga_437';
				src: url('../static/chicago/fonts/dos_vga_437.ttf') format('truetype');
			}

			* {
				cursor: default;
				user-select: none;
			}

			body {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				color: white;
				height: 100vh;
				overflow: hidden;
				background: radial-gradient(ellipse at center, #093e9e 0%, #04142f 100%);
				font-family: 'dos_vga_437', monospace;
			}

			h1 {
				background-color: white;
				color: #093e9e;
				padding: 10px 12px 7px 12px;
				font-size: 32px;
			}

			main {
				max-width: 780px;
				font-size: 21px;
				margin: 0 30px;
			}

			.center {
				text-align: center;
			}
		</style>
	</head>
	<body>
		<h1>KRUITHNE.NET</h1>
		<main>
			<p>This website is under construction, check back soon!</p>
			<p class="center">Press Backspace to go back</p>
		</main>
		<script>
			document.addEventListener('keydown', function(event) {				
				if (event.key === 'Backspace') {
					event.preventDefault();
					window.history.back();
				}
			});
		</script>
	</body>
</html>
