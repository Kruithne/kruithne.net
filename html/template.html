<!DOCTYPE html>
<html lang="en">
	<head>
		<title>{{ page_title }}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96"/>
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
		<link rel="shortcut icon" href="/static/favicon.ico"/>
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
		<meta name="apple-mobile-web-app-title" content="kruithne.net"/>
		<link rel="manifest" href="/static/site.webmanifest"/>
		<meta property="og:type" content="website"/>
		<meta property="og:url" content="https://kruithne.net{{ page_url }}"/>
		<meta property="og:title" content="{{ page_title }}"/>
		<meta property="og:description" content="{{ page_description }}"/>
		<meta property="og:image" content="{{ page_image }}"/>
		<meta name="twitter:card" content="summary_large_image"/>
		<meta name="twitter:description" content="{{ page_description }}"/>
		<meta name="twitter:image" content="{{ page_image }}"/>
		<meta name="theme-color" content="#f7f1eb"/>
		<link rel="preload" href="/static/fonts/google-sans-code-latin.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/static/fonts/terminal-grotesque.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="/{{cache_bust=static/css/global.css}}"/>
	</head>
	<body>
		<div id="image-popout-overlay">
			<button id="image-popout-close" aria-label="Close image">
				<span></span>
				<span></span>
			</button>
			<div id="image-popout-container">
				<div id="image-popout-img-wrapper">
					<img src="" alt="">
				</div>
				<div id="image-popout-title"></div>
			</div>
		</div>
		<div id="page-frame">
			<header id="site-header" class="{{ header_class }}">
				<div id="avatar-tile">
					<a href="/" id="main-avatar" aria-label="Home"></a>
				</div>
				<nav id="site-nav">
					<a href="/" class="nav-item">
						<img class="nav-icon" src="/{{cache_bust=static/images/icons/mono/icon_home.png}}" alt="">
						<span>Home</span>
					</a>
					<a href="/devlog" class="nav-item">
						<img class="nav-icon" src="/{{cache_bust=static/images/icons/mono/icon_devlog.png}}" alt="">
						<span>DevLog</span>
					</a>
					<a href="/projects" class="nav-item">
						<img class="nav-icon" src="/{{cache_bust=static/images/icons/mono/icon_projects.png}}" alt="">
						<span>Projects</span>
					</a>
					<a href="/artwork" class="nav-item">
						<img class="nav-icon" src="/{{cache_bust=static/images/icons/mono/icon_artwork.png}}" alt="">
						<span>Artwork</span>
					</a>
					<a href="/contact" class="nav-item">
						<img class="nav-icon" src="/{{cache_bust=static/images/icons/mono/icon_contact.png}}" alt="">
						<span>Contact</span>
					</a>
				</nav>
				<a href="/" id="site-title">kruithne.net</a>
				{{ header_banner }}
			</header>
			<main id="window-body">
				{{ content }}
			</main>
			<footer id="site-footer">
				<a href="https://steamcommunity.com/id/kruithne" target="_blank" class="social-link social-steam" aria-label="Steam"></a>
				<a href="https://www.youtube.com/@kruithne" target="_blank" class="social-link social-youtube" aria-label="YouTube"></a>
				<a href="https://x.com/Kruithne" target="_blank" class="social-link social-x" aria-label="X"></a>
				<a href="https://www.patreon.com/c/kruithne" target="_blank" class="social-link social-patreon" aria-label="Patreon"></a>
				<a href="https://github.com/Kruithne/" target="_blank" class="social-link social-github" aria-label="GitHub"></a>
				<a href="https://discord.gg/kC3EzAYBtf" target="_blank" class="social-link social-discord" aria-label="Discord"></a>
				<a href="https://bsky.app/profile/kruithne.bsky.social" target="_blank" class="social-link social-bsky" aria-label="BlueSky"></a>
				<div id="footer-note">kruithne.net</div>
			</footer>
		</div>
		<script src="/{{cache_bust=static/js/global.js}}"></script>
	</body>
</html>
