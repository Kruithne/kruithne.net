<!DOCTYPE html>
<html lang="en">
	<head>
		<title>{{ page_title }}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96"/>
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
		<link rel="shortcut icon" href="/static/favicon.ico"/>
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
		<meta name="apple-mobile-web-app-title" content="kruithne.net"/>
		<link rel="manifest" href="/static/site.webmanifest"/>
		<meta property="og:type" content="website"/>
		<meta property="og:url" content="https://kruithne.net{{ page_url }}"/>
		<meta property="og:title" content="{{ page_title }}"/>
		<meta property="og:description" content="{{ page_description }}"/>
		<meta property="og:image" content="{{ page_image }}"/>
		<meta name="twitter:card" content="summary_large_image"/>
		<meta name="twitter:description" content="{{ page_description }}"/>
		<meta name="twitter:image" content="{{ page_image }}"/>
		<meta name="theme-color" content="#008080"/>
		<link rel="preload" href="/static/fonts/google-sans-code-latin.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="/{{cache_bust=static/css/global.css}}"/>
	</head>
	<body>
		<div id="image-popout-overlay">
			<button id="image-popout-close" aria-label="Close image">
				<span></span>
				<span></span>
			</button>
			<div id="image-popout-container">
				<div id="image-popout-img-wrapper">
					<img src="" alt="">
				</div>
				<div id="image-popout-title"></div>
			</div>
		</div>
		<div id="page-container">
			<div id="content-window" class="c-ui-window c-ui-raised active">
				<div class="titlebar active"></div>
				<div id="avatar-window" class="c-ui-window c-ui-raised">
					<div class="titlebar active">
						<span class="title" data-pixel-title="kruithne.net">kruithne.net</span>
					</div>
					<a href="/" id="main-avatar"></a>
				</div>
				<div id="desktop-icons">
					<a href="/" class="desktop-icon">
						<img class="icon-img" src="/{{cache_bust=static/images/icons/icon_home.webp}}">
						<span>Home</span>
					</a>
					<a href="/devlog" class="desktop-icon">
						<img class="icon-img" src="/{{cache_bust=static/images/icons/icon_devlog.webp}}">
						<span>DevLog</span>
					</a>
					<a href="/projects" class="desktop-icon">
						<img class="icon-img" src="/{{cache_bust=static/images/icons/icon_projects.webp}}">
						<span>Projects</span>
					</a>
					<a href="/artwork" class="desktop-icon">
						<img class="icon-img" src="/{{cache_bust=static/images/icons/icon_artwork.webp}}">
						<span>Artwork</span>
					</a>
					<a href="/contact" class="desktop-icon">
						<img class="icon-img" src="/{{cache_bust=static/images/icons/icon_contact.webp}}">
						<span>Contact</span>
					</a>
				</div>
				<div id="window-body">
					{{ content }}
				</div>
			</div>
		</div>
		<div id="taskbar" class="c-ui-raised">
			<button id="start-btn" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-start"></div>
				<span>Start</span>
			</button>
			<a href="https://steamcommunity.com/id/kruithne" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-steam"></div>
				<span>Steam</span>
			</a>
			<a href="https://www.youtube.com/@kruithne" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-youtube"></div>
				<span>YouTube</span>
			</a>
			<a href="https://x.com/Kruithne" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-x"></div>
				<span>X</span>
			</a>
			<a href="https://www.patreon.com/c/kruithne" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-patreon"></div>
				<span>Patreon</span>
			</a>
			<a href="https://github.com/Kruithne/" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-github"></div>
				<span>GitHub</span>
			</a>
			<a href="https://discord.gg/kC3EzAYBtf" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-discord"></div>
				<span>Discord</span>
			</a>
			<a href="https://www.tiktok.com/@_kruithne" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-tiktok"></div>
				<span>TikTok</span>
			</a>
			<a href="https://www.instagram.com/_kruithne/" target="_blank" class="taskbar-btn c-ui-raised">
				<div class="taskbar-icon icon-instagram"></div>
				<span>Instagram</span>
			</a>
			<div id="taskbar-clock"></div>
		</div>
		<script src="/{{cache_bust=static/js/global.js}}"></script>
	</body>
</html>
