<!DOCTYPE html>
<html lang="en">
	<head>
		<title>{{ page_title }}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96"/>
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
		<link rel="shortcut icon" href="/static/favicon.ico"/>
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
		<meta name="apple-mobile-web-app-title" content="kruithne.net"/>
		<link rel="manifest" href="/static/site.webmanifest"/>
		<link rel="preload" href="/static/fonts/google-sans-code-latin.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/static/fonts/atma-latin-400.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="/{{cache_bust=static/css/global.css}}"/>
	</head>
	<body>
		<svg style="display: none;">
			<filter id="wonky">
				<feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
				<feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
			</filter>
		</svg>
		<div id="nav-overlay"></div>
		<div id="image-popout-overlay">
			<button id="image-popout-close" aria-label="Close image">
				<span></span>
				<span></span>
			</button>
			<div id="image-popout-container">
				<img src="" alt="">
			</div>
		</div>
		<div id="page-container">
			<div id="content-container">
				<a href="/" id="main-avatar"></a>
				<div id="main-nav">
					<button id="nav-toggle" aria-label="Toggle navigation">
						<span></span>
						<span></span>
						<span></span>
					</button>
					<div id="nav-links">
						<a>DevLog</a>
						<a>Games</a>
						<a>Warcraft</a>
						<a>Artwork</a>
						<a>Other</a>
					</div>
				</div>
				<div id="main-content">
					{{ content }}
				</div>
			</div>
		</div>
		<footer>
		</footer>
		<script src="/{{cache_bust=static/js/global.js}}"></script>
	</body>
</html>
